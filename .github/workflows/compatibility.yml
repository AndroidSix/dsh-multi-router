name: Cross-platform compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install official DSH modules into an isolated test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-app-boot@0.2.0-rc.2 @deepseek-ai/dsh-client-modules@0.2.0-rc.2 @deepseek-ai/dsh-hmr@0.2.0-rc.2 @deepseek-ai/dsh-plugin-manager@0.2.0-rc.2 @deepseek-ai/dsh-client-ui-slots@0.2.0-rc.2
          node --input-type=module -e "import{appendFileSync}from'node:fs';import{join}from'node:path';appendFileSync(process.env.GITHUB_ENV,'DSH_RUNTIME='+join(process.env.RUNNER_TEMP,'dsh-runtime')+'\n')"
      - name: Verify actual loader, UI slots, CRLF entries and continuous reload
        run: node --test tests/plugin-reload.test.mjs tests/client-runtime.test.mjs tests/startup.test.mjs tests/local-discovery.test.mjs tests/plugin-updates.test.mjs
