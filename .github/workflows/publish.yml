name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.3.8
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.19.0
      - name: Validate release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const lock = JSON.parse(readFileSync('package-lock.json'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Release tag and package versions must match');
          }
          appendFileSync(process.env.GITHUB_ENV, `NPM_TAG=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          JS
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack only distributable files
        run: npm pack --ignore-scripts
      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ./dsh-multi-router-*.tgz --clobber
      - name: Publish using npm Trusted Publishing
        run: npm publish ./dsh-multi-router-*.tgz --access public --provenance --ignore-scripts --tag "$NPM_TAG"
